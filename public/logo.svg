    <text x="96" y="52" fill="#F5F3EF">SPOT</text>
    <text x="204" y="52" fill="#FFD100">ON</text>
  </g>
  <rect x="96" y="60" width="160" height="3" fill="#C8102E"/>
  <text x="96" y="79" fill="#8A8A82" font-size="11" letter-spacing="3.4"
        font-family="'Arial Narrow', Arial, Helvetica, sans-serif">REVENUE OPERATING SYSTEM</text>
</svg>
