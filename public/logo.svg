<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" width="400" height="96" role="img" aria-label="SpotOn — Revenue Operating System">
  <title>SpotOn — Revenue Operating System</title>
  <rect width="400" height="96" fill="#0A0A0A"/>

  <!-- mark -->
  <g transform="translate(16 16)">
    <g stroke="#F5F3EF" stroke-width="3">
      <path d="M32 2v7M32 55v7M2 32h7M55 32h7"/>
    </g>
    <circle cx="32" cy="32" r="23" fill="none" stroke="#FFD100" stroke-width="6"
            stroke-dasharray="100 20" transform="rotate(-58 32 32)"/>
    <circle cx="32" cy="32" r="12.5" fill="none" stroke="#C8102E" stroke-width="6"/>
    <circle cx="32" cy="32" r="4.5" fill="#FFD100"/>
  </g>

  <!-- wordmark -->
  <g font-family="Impact, Haettenschweiler, 'Arial Narrow', 'Franklin Gothic Bold', sans-serif"
