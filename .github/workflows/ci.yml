name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Both supported majors run, and one failing does not mask the other —
      # which is what makes a version-specific break obvious rather than a
      # mystery.
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        # PGlite is real Postgres compiled to WebAssembly, so the integration
        # suite needs no database service container. The github-actions reporter
        # annotates failures inline on the commit and pull request, which beats
        # digging through raw job logs.
        run: npm test -- --reporter=default --reporter=github-actions --no-color
        env:
          TZ: UTC

  smoke:
    name: Build and end-to-end smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare the demo database
        run: npm run db:setup

      - name: Build
        run: npm run build

      - name: End-to-end smoke test
        run: npm run test:e2e
        env:
          MCP_API_TOKEN: ci-mcp-token
          TZ: UTC
